<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Service Temporarily Unavailable</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f7fa;
      color: #25324a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .card {
      width: min(680px, 100%);
      padding: 48px 42px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(20, 37, 63, 0.10);
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eef4ff;
      color: #2463eb;
      font-size: 30px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(30px, 6vw, 42px);
      color: #172033;
    }
    p {
      margin: 0 auto;
      max-width: 540px;
      font-size: 18px;
      line-height: 1.65;
    }
    .note {
      margin-top: 22px;
      color: #667085;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">i</div>
    <h1>Sorry, this service is temporarily unavailable.</h1>
    <p>
      We are currently moving this service to the internal hosting environment.
      The service will be available again soon.
    </p>
    <p class="note">Thank you for your patience and understanding.</p>
  </main>
</body>
</html>
